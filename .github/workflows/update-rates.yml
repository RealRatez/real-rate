name: Update rates daily

on:
  schedule:
    # 11:00 UTC ≈ 6-7am US Eastern, after most overnight data series post.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        run: python scripts/update_rates.py
        env:
          # Required for reliable fetches from GitHub Actions' shared IPs —
          # get a free key at fred.stlouisfed.org (My Account -> API Keys)
          # and store it as a repo secret named FRED_API_KEY.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional: set this repo secret once you're ready to actually
          # deliver zone-change alerts (e.g. a Zapier "Webhooks by Zapier"
          # URL). Safe to leave unset for now — alerts still get logged
          # to data/alerts.json either way.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: Commit changes if any
        run: |
          git config user.name "saver-almanac-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "--- git status ---"
          git status
          echo "--- git diff (unstaged) ---"
          git diff -- index.html || true
          # Add index.html and data/ SEPARATELY. Listing individual data
          # files in one `git add` call (e.g. data/alerts.json, which only
          # exists once a zone-change alert has actually fired) means git
          # aborts the WHOLE add if any single path doesn't exist yet —
          # silently dropping index.html's real changes along with it.
          # Adding the directory instead sidesteps this entirely.
          git add index.html
          git add data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily rate update: $(date -u +'%Y-%m-%d')"
            # If something else (e.g. a manual edit via GitHub's web UI)
            # pushed to main between this job's checkout and its push,
            # the push below gets rejected with "fetch first". Rather than
            # discarding this run's real data, fetch the latest and rebase
            # our one commit on top, then retry — a few times, since a
            # race can in principle repeat.
            push_ok=false
            for i in 1 2 3 4 5; do
              if git push; then
                push_ok=true
                break
              fi
              echo "Push rejected (attempt $i/5) — fetching latest and rebasing..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase conflict — aborting. Will retry fresh on the next scheduled run."
                git rebase --abort
                break
              fi
              sleep $((i * 3))
            done
            if [ "$push_ok" != true ]; then
              echo "::error::Failed to push after retries — today's data was fetched but not published. See log above."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
